<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Expense Analytics Dashboard</h1>

    <div class="container">
        <!-- Input Form -->
        <div class="card form-section">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
                <div class="form-group">
                    <label for="expName">Expense Name:</label>
                    <input type="text" id="expName" required placeholder="e.g., Dinner, Bus ticket">
                </div>
                
                <div class="form-group">
                    <label for="expAmount">Amount (₹):</label>
                    <input type="number" id="expAmount" required min="1" step="1" placeholder="e.g., 500">
                </div>

                <div class="form-group">
                    <label for="expCategory">Category:</label>
                    <select id="expCategory" required>
                        <option value="Food">Food & Dining</option>
                        <option value="Transport">Transportation</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Utilities">Utilities & Bills</option>
                        <option value="Entertainment">Entertainment</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expDate">Date:</label>
                    <input type="date" id="expDate" required>
                </div>

                <button type="submit">Log Expense</button>
            </form>
        </div>

        <!-- Analytics Section -->
        <div class="card analytics-section">
            <h2>Analytics Overview</h2>
            
            <div class="total-box">
                <p>Total Spent</p>
                <h3 id="totalSpent">₹0</h3>
            </div>

            <h3>Spending by Category</h3>
            <!-- This container will be filled dynamically by JavaScript -->
            <div id="categoryBreakdown" class="category-breakdown">
                <p class="empty-msg">No data to analyze yet.</p>
            </div>
        </div>
    </div>

    <!-- Expense History Table -->
    <div class="card full-width">
        <h2>Recent Transactions</h2>
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="expenseList">
                <!-- Data will be inserted here -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
